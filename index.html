<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outline">
        <div class="screen">

        <div class="display" id="display"></div>
        <hr/>
        <div class="answer" id="answer"></div>

        </div>
        <div class="keyarea">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>%</button>
            <button>→</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>x</button>
            <button>/</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
            <button class="ebutton">=</button>
            <button class="cbutton">C</button>
            <button>0</button>
            <button>.</button>
            <button>+</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
